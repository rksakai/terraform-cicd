name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "destroy" (sem aspas) para confirmar a destruicao dos recursos'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-confirmation:
    name: Validar confirmacao manual
    runs-on: ubuntu-latest
    steps:
      - name: Checar palavra de confirmacao
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmacao invalida. Voce digitou: '${{ github.event.inputs.confirm }}'"
            echo "E necessario digitar exatamente 'destroy' para prosseguir."
            exit 1
          fi
          echo "Confirmacao validada. Prosseguindo com o destroy."

  plan-destroy:
    name: Terraform Plan (Destroy)
    needs: validate-confirmation
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Exportar credenciais para o Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend-config="key=terraform.dev.tfstate"

      - name: Terraform Plan Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -destroy -no-color -out=tfdestroyplan

      - name: Upload plano de destroy
        uses: actions/upload-artifact@v4
        with:
          name: tfdestroyplan
          path: ${{ env.TF_WORKING_DIR }}/tfdestroyplan
          retention-days: 1

  destroy:
    name: Terraform Destroy (Aplicar)
    needs: plan-destroy
    runs-on: ubuntu-latest
    environment: production-destroy   # ambiente separado do "production" usado no apply
    env:
      TF_WORKING_DIR: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Exportar credenciais para o Terraform
        run: |
          echo "ARM_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientId)" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .clientSecret)" >> $GITHUB_ENV
          echo "ARM_SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .subscriptionId)" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r .tenantId)" >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend-config="key=terraform.dev.tfstate"

      - name: Download plano de destroy
        uses: actions/download-artifact@v4
        with:
          name: tfdestroyplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply (Destroy)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfdestroyplan
